# fly.toml app configuration file generated for tazbhai on 2026-11-11

app = "tazbhai"
primary_region = "fra"  # Aap apna qareeb tareen region rakh sakte hain (jaise fra for Frankfurt)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # Bohat zaroori hai! Isay false rakhein taake bot 24/7 background mein chalta rahe aur auto-stop na ho.
  auto_start_machines = true
  min_machines_running = 1     # Kam az kam 1 machine hamesha on rahegi.
  processes = ["app"]

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024             # Playwright aur Chromium ke liye 1GB (1024MB) RAM lazmi hai taake crash na ho.
